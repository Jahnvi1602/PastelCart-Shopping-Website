<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart - PastelCart</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

<nav class="navbar">

    <div class="logo">
        🌸 PastelCart
    </div>

    <ul class="nav-links">

        <li><a href="index.html">Home</a></li>
        <li><a href="clothing.html">Clothing</a></li>
        <li><a href="footwear.html">Footwear</a></li>
        <li><a href="household.html">Household</a></li>

        <li><a href="jewellery.html">Jewellery</a></li>

</a></li>
        <li><a href="contact.html">Contact</a></li>

    </ul>

</nav>

</header>


<section class="page-banner">

    <p>YOUR SHOPPING BAG</p>

    <h1>Shopping Cart 🛒</h1>

    <p>Review your selected products.</p>

</section>


<section class="cart-section">

    <div id="cartItems">

        <!-- JavaScript will display cart products here -->

    </div>


    <div class="cart-summary">

        <h2>Order Summary</h2>

        <div class="summary-row">

            <span>Subtotal</span>

            <span id="cartTotal">₹0</span>

        </div>

        <div class="summary-row">

            <span>Delivery</span>

            <span>FREE</span>

        </div>

        <hr>

        <div class="summary-row total">

            <span>Total</span>

            <span id="finalTotal">₹0</span>

        </div>


        <button
            class="checkout-btn"
            onclick="checkout()">

            Place Order

        </button>

    </div>

</section>


<footer>

<div class="copyright">

    <p>© 2026 PastelCart. All Rights Reserved.</p>

</div>

</footer>


<script src="js/script.js"></script>
